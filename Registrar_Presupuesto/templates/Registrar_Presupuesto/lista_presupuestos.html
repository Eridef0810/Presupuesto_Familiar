{% extends 'base.html' %}
{% load static %}

{% block title %}Crear Presupuesto{% endblock %}

{% block content %}

            <!-- 📌 Sección del Formulario -->
            <div class="container w-75">
              <div class="row">
                  <div class="col">
                      <div class="card shadow p-4">
                          <h4 class="text-center text-primary mb-4">Registrar Presupuesto</h4>
      
                          <form action="{% url 'guardar_presupuesto' %}" method="post">

                            {% csrf_token %}
                            <div class="row">
                              <!-- CATEGORÍA -->
                              <div class="row">
                              <div class="col-md-6">              
                                <div class="mb-3">
                                  <label class="form-label">Presupuesto:</label>
                                  <p class="form-control-plaintext fw-bold">{{ presupuesto_nombre  }}</p>
                                  
                            </div>
                          </div>
                              <div class="col-md-6">
                                <div class="mb-3">
                                  <label for="categoriaSelect" class="form-label">Categoría:</label>
                                  <select id="categoriaSelect" class="form-select" required>
                                    <option value="">Seleccione una categoría</option>
                                  {% for categoria in categorias %}
                                    <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                                  {% endfor %}
                                  </select>

                                </div>
                              </div>
                            </div>
                            <div class="row">
                              <!-- CONCEPTO -->
                              <div class="col-md-6">
                                <div class="mb-3">
                                  <label for="conceptoSelect" class="form-label">Concepto:</label>
                                  <select id="conceptoSelect" name="concepto_id" class="form-select" required>
                                    <option value="">Seleccione un concepto</option>
                                  </select>
                                </div>
                              </div>
                            
                             <!-- RESPONSABLE -->
                             <div class="col-md-6">
                             <div class="mb-3">
                              <label for="Responsable" class="form-label">Responsable:</label>
                              <select name="responsable_id" id="Responsable" class="form-select" required>
                                <option value="" selected>Seleccione un Responsable</option>
                                {% for responsable in responsables %}
                                  <option value="{{ responsable.id }}">{{ responsable.nombre }}</option>
                                {% endfor %}
                              </select>

                            </select>
                            </div>
                          </div>
                        </div>
                          
                            <script>
                              document.getElementById('categoriaSelect').addEventListener('change', function () {
                                const categoriaId = this.value;
                                const conceptoSelect = document.getElementById('conceptoSelect');
                              
                                conceptoSelect.innerHTML = '<option>Cargando...</option>';
                              
                                if (categoriaId) {
                                  fetch(`/conceptos/${categoriaId}/`)
                                    .then(response => {
                                      if (!response.ok) {
                                        throw new Error('Error en la respuesta del servidor');
                                      }
                                      return response.json();
                                    })
                                    .then(data => {
                                      console.log("✅ Datos recibidos:", data);  // VER EN CONSOLA
                                      conceptoSelect.innerHTML = '<option value="">Seleccione un concepto</option>';
                                      if (Array.isArray(data) && data.length > 0) {
                                        data.forEach(concepto => {
                                          const option = document.createElement('option');
                                          option.value = concepto.id;
                                          option.textContent = concepto.nombre;
                                          conceptoSelect.appendChild(option);
                                        });
                                      } else {
                                        const option = document.createElement('option');
                                        option.textContent = "No hay conceptos disponibles";
                                        conceptoSelect.appendChild(option);
                                      }
                                    })
                                    .catch(error => {
                                      console.error('❌ Error al cargar conceptos:', error);
                                      conceptoSelect.innerHTML = '<option>Error al cargar</option>';
                                    });
                                } else {
                                  conceptoSelect.innerHTML = '<option value="">Seleccione un concepto</option>';
                                }
                              });
                              </script>
                                                      
                              <div class="row">
                                <!-- MONTO -->
                                <div class="col-md-6">
                                <div class="mb-3">
                                  <label for="Valor" class="form-label fw-semibold">$ Valor Presupuesto</label>
                                  <input type="number" id="Valor" name="valor" class="form-control" placeholder="Ingrese el valor" required min="0" step="0.01">
                                </div>
                              </div>
              
                              <div class="col-md-6">
                                <div class="mb-3">
                                  <label for="fecha_pago" class="form-label">Fecha de Pago</label>
                                  <input type="date" id="date" name="date" class="form-control" placeholder="Ingrese una Fecha" required>
                                </div>
                              </div>
                            </div>                              
                           
                                                        
                          
                            <!-- OBSERVACIONES -->
                            <div class="mb-3">
                              <label for="Obs" class="form-label">Observaciones</label>
                              <textarea name="observaciones" id="Obs" class="form-control" rows="4" placeholder="Ingrese cualquier comentario"></textarea>
                            </div>
                          
                            <!-- BOTONES -->
                            <div class="mt-4 text-end">
                              <button type="reset" class="btn btn-danger">Limpiar</button>
                              <button type="button" id="agregarCarrito" class="btn btn-primary">Agregar al Presupuesto</button>
                              <a href="{% url 'total_presupuesto' %}" class="btn btn-success">Ver Presupuesto</a>
                          </div>
                          
                            
                          </form>
                            <script>
                              document.getElementById('agregarCarrito').addEventListener('click', function () {
                                const conceptoId = document.getElementById('conceptoSelect').value;
                                const valor = document.getElementById('Valor').value;
                                const fechaPago = document.getElementById('date').value;  // Fecha seleccionada
                                const responsableId = document.getElementById('Responsable').value;
                                const observaciones = document.getElementById('Obs').value;
                                const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
                            
                                console.log("Fecha de pago seleccionada:", fechaPago);  // Verificar que la fecha es correcta
                            
                                fetch("{% url 'agregar_al_carrito' %}", {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/x-www-form-urlencoded',
                                        'X-CSRFToken': csrfToken
                                    },
                                    body: new URLSearchParams({
                                        concepto_id: conceptoId,
                                        valor: valor,
                                        responsable_id: responsableId,
                                        observaciones: observaciones,
                                        fecha_pago: fechaPago  // Enviar la fecha seleccionada
                                    })
                                })
                                .then(response => response.json())
                                .then(data => {
                                    if (data.status === 'ok') {
                                        const toastEl = document.getElementById('toastConfirmacion');
                                        const toast = new bootstrap.Toast(toastEl);
                                        toast.show();
                            
                                        setTimeout(() => {
                                            location.reload();
                                        }, 2000);
                                    } else {
                                        alert('Error al agregar al carrito');
                                    }
                                })
                                .catch(error => {
                                    console.error('Error al enviar los datos:', error);
                                });
                            });
                            
                              </script>
                              <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
                                <div id="toastConfirmacion" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
                                    <div class="d-flex">
                                        <div class="toast-body">
                                            Ítem agregado exitosamente al presupuesto.
                                        </div>
                                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
                                    </div>
                                </div>
                            </div>
                            
                              

   

                           
                        </div>
                    </div>
                </div>
            </div>
                   
        </div>

        {% endblock %}
