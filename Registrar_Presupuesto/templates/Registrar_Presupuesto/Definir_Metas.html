{% extends 'base.html' %}
{% load static %}

{% block title %}Definir Metas{% endblock %}

{% block content %}
<div class="container w-75">
  <div class="row">
      <div class="col">
          <div class="card shadow p-4">
  <h3 class="text-center text-primary mb-4">🎯Definir Metas</h3>

  <form id="GuardarMetaForm" action="{% url 'guardar_metas' %}" method="post">
    {% csrf_token %}
    <input type="hidden" name="categoria_id" value="11">
    
    <div class="row">
      <div class="col-md-6">
        <div class="mb-3">
          <label for="ConceptoSelect" class="form-label">Concepto:</label>
          <select id="ConceptoSelect" name="concepto_id" class="form-select" required>
            <option value="">Cargando conceptos...</option>
          </select>
        </div>
      </div>
  
      <div class="col-md-6">
        <div class="mb-3">
          <label for="meta" class="form-label">Nombre de la Meta</label>
          <input type="text" class="form-control" id="meta" name="nombre" required>
        </div>
      </div>
    </div>
  
    <div class="mb-3">
      <label for="Obs" class="form-label">Descripción de la Meta</label>
      <textarea name="descripcion" id="descripcion" class="form-control" rows="4" placeholder="Describa su Meta"></textarea>
    </div>
  
    <div class="mb-3">
      <label for="valor" class="form-label">Valor Meta ($)</label>
      <input type="number" class="form-control" id="valor" name="valor" required>
    </div>
  
    <div class="mb-3">
      <label for="fecha" class="form-label">Fecha Límite</label>
      <input type="date" class="form-control" id="fecha" name="fecha" required>
    </div>
  
    <div class="text-center">
      <button type="submit" class="btn btn-primary" name="GuardarMeta">
        <i class="bi bi-check2-circle me-1"></i> Guardar Meta
      </button>
    </div>
  </form>
 </div>
{% endblock %}
{% block extra_js %}

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('GuardarMetaForm');
    const conceptoSelect = document.getElementById('ConceptoSelect');
    const categoriaId = 11; // Fijo

    // Cargar los conceptos al cargar la página
    fetch(`/api/conceptos/${categoriaId}/`)
        .then(response => response.json())
        .then(data => {
            conceptoSelect.innerHTML = '<option value="">Seleccione un Concepto</option>';
            data.forEach(concepto => {
                const option = document.createElement('option');
                option.value = concepto.id;
                option.textContent = concepto.nombre;
                conceptoSelect.appendChild(option);
            });
        })
        .catch(error => {
            console.error('Error cargando conceptos:', error);
            conceptoSelect.innerHTML = '<option value="">Error al cargar conceptos</option>';
        });

    form.addEventListener('submit', function(event) {
        event.preventDefault(); // Evitar el envío tradicional del formulario

        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
                'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
            },
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                Swal.fire({
                    title: 'Meta guardada exitosamente.',
                    text: '¿Desea agregar otra meta?',
                    icon: 'success',
                    showCancelButton: true,
                    confirmButtonText: 'Sí, agregar otra',
                    cancelButtonText: 'No, terminar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        form.reset();
                        // Recargar conceptos (opcional)
                        fetch(`/api/conceptos/${categoriaId}/`)
                            .then(response => response.json())
                            .then(data => {
                                conceptoSelect.innerHTML = '<option value="">Seleccione un Concepto</option>';
                                data.forEach(concepto => {
                                    const option = document.createElement('option');
                                    option.value = concepto.id;
                                    option.textContent = concepto.nombre;
                                    conceptoSelect.appendChild(option);
                                });
                            })
                            .catch(error => {
                                console.error('Error recargando conceptos:', error);
                                conceptoSelect.innerHTML = '<option value="">Error al cargar conceptos</option>';
                            });
                    } else if (result.isDismissed) { // <-- Redirigir solo si el usuario hace clic en "No, terminar" o fuera del modal
                        window.location.href = "{% url 'pagina_inicial' %}";
                    }
                });
            } else {
                Swal.fire('Error', data.message, 'error');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            Swal.fire('Error', 'Ocurrió un error al guardar el meta.', 'error');
        });
    });
});</script> 
  {% endblock %}
