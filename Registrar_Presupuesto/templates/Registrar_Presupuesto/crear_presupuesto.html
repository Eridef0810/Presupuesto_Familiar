{% extends 'base.html' %}
{% load static %}

{% block title %}Crear Presupuesto{% endblock %}

{% block content %}
<div class="container w-75 vh-100 p-4">
  <div class="row">
    <div class="col">
      <div class="card shadow p-4">
        <h4 class="text-center text-primary mb-4">Crear Presupuesto</h4>
        <form method="POST" action="{% url 'capturar_cabecera_presupuesto' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre Presupuesto</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required>
          </div>

          <div class="mb-3">
            <label for="mes" class="form-label">Mes</label>
            <input type="month" class="form-control" id="mes" name="mes" required>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="fecha_inicio" class="form-label">📅 Fecha Inicio</label>
                <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="fecha_fin" class="form-label">📅 Fecha Fin</label>
                <input type="date" class="form-control" id="fecha_fin" name="fecha_fin" required>
              </div>
            </div>
          </div>

          <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-plus-circle me-1"></i> Crear Presupuesto
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.getElementById('fecha_inicio').addEventListener('change', function () {
    const fechaFin = document.getElementById('fecha_fin');
    fechaFin.min = this.value;

    if (fechaFin.value && fechaFin.value < this.value) {
      fechaFin.value = '';
    }
  });
</script>
{% endblock %}
